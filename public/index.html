<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agentic Loop Observability Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div class="brand-lockup">
          <strong>ALO</strong>
          <span>Agentic Loop Observatory</span>
        </div>
        <nav class="primary-nav" aria-label="Dashboard views">
          <a href="#output-review" class="primary-nav__link primary-nav__link--active">Output review</a>
          <a href="#execution-observability" class="primary-nav__link">Loop execution</a>
          <a href="#json-evidence" class="primary-nav__link">Evidence</a>
        </nav>
        <a href="#output-review" class="topbar__link">Open current view</a>
      </header>

      <section class="viewbar">
        <div>
          <h1>Output review</h1>
          <span data-role="status">Loading local state...</span>
        </div>
        <div class="viewbar__links" aria-label="Output filters">
          <a href="#output-review" class="viewbar__link viewbar__link--active">All</a>
          <a href="#output-review" class="viewbar__link">Awaiting review</a>
          <a href="#output-review" class="viewbar__link">Needs changes</a>
        </div>
      </section>

      <section class="summarybar" aria-label="Pilot summary">
        <div class="topbar__metrics" data-role="pilot-metrics" aria-live="polite"></div>
        <div class="toolbar">
          <button data-action="diagnostics" class="toolbar-button">Download diagnostics</button>
          <button data-action="export" class="toolbar-button">Export state</button>
          <label class="toolbar-button toolbar-button--file">
            Restore state
            <input id="restoreFile" type="file" accept="application/json" />
          </label>
        </div>
      </section>

      <div class="statusbar" aria-live="polite">
        <span>Local state and cached evidence are the source of truth for this view.</span>
      </div>

      <main id="output-review" class="layout">
        <aside class="sidebar">
          <div class="sidebar__header">
            <p class="eyebrow">Inbox</p>
            <h2>Outputs awaiting accountability</h2>
          </div>
          <section class="sidebar__list" data-role="output-list" aria-live="polite"></section>
        </aside>

        <section class="content" data-role="detail" aria-live="polite"></section>
      </main>
    </div>
    <script type="module" src="/assets/app.js"></script>
  </body>
</html>
